
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vesperia SMP | Форум</title>
    <link rel="icon" href="https://i.postimg.cc/Pf4nb7xV/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-forum">
    <canvas id="star-canvas"></canvas>
    <div class="glow-bg"></div>

    <nav class="main-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <img src="https://i.postimg.cc/Pf4nb7xV/logo.png" alt="Logo">
                <span>VESPERIA</span>
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-item">Главная</a>
                <a href="forum.html" class="nav-item active">Форум</a>
                <a href="wiki.html" class="nav-item">Вики</a>
                <a href="rules.html" class="nav-item">Правила</a>
                <a href="gallery.html" class="nav-item">Галерея</a>
                <a href="staff.html" class="nav-item">Команда</a>
            </div>
            <div class="nav-actions">
                <div id="authContainer">
                    <button class="btn btn-discord" onclick="login()"><i class="fab fa-discord"></i> Войти</button>
                </div>
                <button class="menu-toggle" onclick="document.querySelector('.nav-links').classList.toggle('active')"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </nav>

    <main class="content-container">
        <div class="panel">
            <div class="panel-header">
                <h2><i class="fas fa-comments"></i> Форум сообщества</h2>
                <button class="btn btn-accent auth-only" onclick="tryOpenModal('postModal')">Создать тему</button>
            </div>
            <div class="panel-body" id="postsGrid">
                <div class="loading-state">Загружаем обсуждения...</div>
            </div>
        </div>
    </main>

    <!-- Create Post Modal -->
    <div id="postModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-head">
                <h3>Новое обсуждение</h3>
                <button class="close-btn" onclick="closeModals()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Заголовок</label>
                    <input type="text" id="postTitle" placeholder="Суть темы" maxlength="60">
                </div>
                <div class="form-group">
                    <label>Сообщение</label>
                    <textarea id="postContent" rows="6" placeholder="Ваше сообщение..."></textarea>
                </div>
                <button class="btn btn-primary full-width" onclick="submitPost()">Опубликовать</button>
            </div>
        </div>
    </div>

    <!-- Topic View Modal (Chat Style) -->
    <div id="topicModal" class="modal-overlay">
        <div class="modal-card modal-wide">
            <div class="modal-head">
                <h3 id="topicModalTitle">Тема</h3>
                <button class="close-btn" onclick="closeModals()">&times;</button>
            </div>
            <div class="topic-modal-body">
                <div id="chatContainer" class="chat-container">
                    <!-- Chat messages here -->
                </div>
                <div class="chat-input-area">
                    <input type="text" id="commentInput" placeholder="Написать комментарий..." style="margin:0;">
                    <button class="btn-send" onclick="submitComment()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast-box"></div>
    <footer>
        <p>&copy; 2026 Vesperia SMP.</p>
        <p style="opacity: 0.5; font-size: 0.75rem; margin-top: 10px;">Not affiliated with Mojang AB.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
