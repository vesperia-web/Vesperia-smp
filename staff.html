
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vesperia SMP | Команда</title>
    <link rel="icon" href="https://i.postimg.cc/Pf4nb7xV/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Библиотека для 3D скинов -->
    <script src="https://bs-community.github.io/skinview3d/js/skinview3d.bundle.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .staff-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 40px; 
            margin-top: 40px; 
            justify-content: center;
        }
        
        .staff-card {
            background: rgba(20, 20, 25, 0.8); 
            border: 1px solid var(--border); 
            border-radius: 20px;
            overflow: hidden; 
            text-align: center; 
            transition: 0.3s; 
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .staff-card:hover { 
            border-color: var(--accent); 
            box-shadow: 0 20px 50px rgba(139, 92, 246, 0.15); 
            transform: translateY(-5px);
        }

        /* Контейнер для 3D модели */
        .model-wrapper {
            width: 100%;
            height: 350px;
            background: radial-gradient(circle at center, rgba(139, 92, 246, 0.15), transparent 70%);
            position: relative;
            cursor: move; /* Показываем, что можно крутить */
        }

        .staff-info { 
            padding: 25px; 
            background: rgba(10, 10, 12, 0.6);
            border-top: 1px solid rgba(255,255,255,0.05);
            flex-grow: 1;
            z-index: 2;
        }

        .staff-name { 
            font-size: 1.8rem; 
            font-weight: 900; 
            color: white; 
            margin-bottom: 8px; 
            letter-spacing: -0.5px;
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        .staff-role { 
            display: inline-block; 
            padding: 6px 16px; 
            border-radius: 50px; 
            font-size: 0.8rem; 
            font-weight: 700; 
            text-transform: uppercase; 
            margin-bottom: 5px; /* Уменьшил отступ, так как описания нет */
            letter-spacing: 1px;
        }
        
        .role-owner { 
            background: rgba(239, 68, 68, 0.15); 
            color: #ef4444; 
            border: 1px solid rgba(239, 68, 68, 0.4); 
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.1);
        }

        /* Декор за карточкой */
        .card-decoration {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            opacity: 0.3;
            color: white;
            z-index: 1;
        }
    </style>
</head>
<body class="page-staff">
    <canvas id="star-canvas"></canvas>
    <div class="glow-bg"></div>

    <nav class="main-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <img src="https://i.postimg.cc/Pf4nb7xV/logo.png" alt="Logo">
                <span>VESPERIA</span>
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-item">Главная</a>
                <a href="forum.html" class="nav-item">Форум</a>
                <a href="wiki.html" class="nav-item">Вики</a>
                <a href="rules.html" class="nav-item">Правила</a>
                <a href="gallery.html" class="nav-item">Галерея</a>
                <a href="staff.html" class="nav-item active">Команда</a>
            </div>
            <div class="nav-actions">
                <div id="authContainer">
                    <button class="btn btn-discord" onclick="login()"><i class="fab fa-discord"></i> Войти</button>
                </div>
                <button class="menu-toggle" onclick="document.querySelector('.nav-links').classList.toggle('active')"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </nav>

    <main class="content-container">
        <div class="hero">
            <h1 class="hero-title">Команда <span class="accent">Проекта</span></h1>
            <p class="hero-subtitle">Создатели Vesperia SMP</p>
        </div>

        <div class="staff-grid">
            <!-- SHARK -->
            <div class="staff-card">
                <i class="fas fa-code card-decoration"></i>
                <!-- Контейнер для 3D Canvas -->
                <div class="model-wrapper" id="skin-container-shark"></div>
                
                <div class="staff-info">
                    <div class="staff-name">X_x_shark_x_X</div>
                    <div class="staff-role role-owner">Создатель</div>
                </div>
            </div>

            <!-- LEYNAR -->
            <div class="staff-card">
                <i class="fas fa-crown card-decoration"></i>
                <!-- Контейнер для 3D Canvas -->
                <div class="model-wrapper" id="skin-container-leynar"></div>
                
                <div class="staff-info">
                    <div class="staff-name">Leynar_</div>
                    <div class="staff-role role-owner">Создатель</div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Vesperia SMP. Все права защищены.</p>
        <p style="opacity: 0.5; font-size: 0.75rem; margin-top: 10px;">Not affiliated with Mojang AB.</p>
    </footer>
    <script src="script.js"></script>
    
    <!-- Скрипт инициализации 3D моделей -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            function initSkinViewer(containerId, username) {
                const container = document.getElementById(containerId);
                // Получаем размеры контейнера
                const width = container.offsetWidth;
                const height = container.offsetHeight;

                const skinViewer = new skinview3d.SkinViewer({
                    canvas: document.createElement("canvas"), // Создаем canvas динамически
                    width: width,
                    height: height,
                    skin: `https://minotar.net/skin/${username}` // Берем текстуру скина
                });

                // Добавляем canvas в контейнер
                container.appendChild(skinViewer.canvas);

                // Настройки камеры (чтобы скин был виден хорошо)
                skinViewer.camera.position.x = 20;
                skinViewer.camera.position.y = 15;
                skinViewer.camera.position.z = 40;
                skinViewer.zoom = 0.9;

                // Включаем анимацию "Idle" (дыхание)
                skinViewer.animation = new skinview3d.IdleAnimation();
                
                // Включаем вращение мышкой
                skinViewer.controls.enableRotate = true;
                skinViewer.controls.enableZoom = true;
                skinViewer.controls.enablePan = false;

                // Автоматическое вращение ОТКЛЮЧЕНО
                skinViewer.autoRotate = false;
                
                // Ресайз при изменении окна
                window.addEventListener('resize', () => {
                    skinViewer.width = container.offsetWidth;
                    skinViewer.height = container.offsetHeight;
                });
            }

            // Инициализация для обоих админов
            // ВАЖНО: Ники должны быть точными как в Minecraft, чтобы текстура загрузилась
            initSkinViewer("skin-container-shark", "X_x_shark_x_X");
            initSkinViewer("skin-container-leynar", "Leynar_");
        });
    </script>
</body>
</html>
